x-tidbyt-build: &tidbyt-build
  context: prometheus-monitoring
  args:
    BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
    PIXLET_VERSION: ${PIXLET_VERSION:-0.34.0}

services:
  serve:
    build: *tidbyt-build
    image: loca-tidbyt/tidbyt:prometheus-monitoring
    env_file:
      - .env
    ports:
      - 18080:8080
    volumes:
      - type: bind
        source: prometheus-monitoring
        target: /workspace
    entrypoint:
      [
        "pixlet",
        "serve",
        "--host=0.0.0.0",
        "/workspace/prometheus-monitoring.star",
      ]

  render:
    build: *tidbyt-build
    image: loca-tidbyt/tidbyt:prometheus-monitoring
    env_file:
      - .env
    volumes:
      - type: bind
        source: prometheus-monitoring
        target: /workspace
    entrypoint: ["/bin/bash", "/workspace/daemonize-push.sh", "render"]

  daemonize:
    build: *tidbyt-build
    image: loca-tidbyt/tidbyt:prometheus-monitoring
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "/bin/bash", "/workspace/daemonize-push.sh", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  default:
    name: tidbyt_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24
          gateway: 172.30.50.1
